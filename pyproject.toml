[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoheihe-cli"
version = "0.1.0+local.1"
description = "小黑盒账号、游戏评测和社区操作 CLI（本地改进版）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
    "qrcode[pil]>=8,<9",
    "pydantic>=2,<3",
    "markdown>=3.7,<4",
    "pygments>=2.17,<3",
    "mcp>=1.20,<2",
]

[project.urls]
Repository = "https://github.com/huajiao1998/xiaoheihe-mcp"
Upstream = "https://github.com/AaronZ345/xiaoheihe-cli"

[project.scripts]
xiaoheihe = "xhh_operator.cli:main"
xiaoheihe-cli = "xhh_operator.cli:main"

[tool.setuptools]
packages = ["xhh_operator", "xiaoheihe"]
py-modules = [
    "api_client", "browser_manager", "config", "data_parser",
    "markdown_converter", "models", "utils", "cli", "api_server", "crawler",
]

# 上游用 data-files 装它自带的 skill 文档；我们走 MCP，不需要，
# 所以没保留 [tool.setuptools.data-files]，也不用放 skills/ 目录。

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "xhh_operator/**/*.py", "xiaoheihe/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
